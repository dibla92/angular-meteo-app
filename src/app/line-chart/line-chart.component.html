<div
  *ngIf="chartOptions && chartOptions.series && chartOptions.series.length"
  style="overflow-x: auto; width: 100%;"
>
  <div style="width: 100vw;">
    <highcharts-chart
      [Highcharts]="Highcharts"
      [options]="chartOptions"
      style="width: 100%; height: 400px; display: block;"
    ></highcharts-chart>
  </div>
</div>
